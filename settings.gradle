pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url 'https://maven.fabricmc.net/' }
        maven { url 'https://maven.architectury.dev/' }
        maven { url 'https://maven.minecraftforge.net' }
        maven { url 'https://repo.william278.net/releases' }
        maven { url 'https://repo.essential.gg/repository/maven-public' }
    }

    plugins {
        def egtVersion = "0.7.0"
        id("gg.essential.defaults") version egtVersion
        id("gg.essential.multi-version.root") version egtVersion
    }
}

rootProject.name = 'Toilet'
include(
        'common',

        // Server Plugins
        'bukkit',

        // Proxy Plugins
        'velocity',
)

// Fabric Server-Side Mods
include("fabric")
project(":fabric").with {
    projectDir = file("fabric/")
    buildFileName = "root.gradle"
}

file('fabric').listFiles((FileFilter) ((File file) -> file.isDirectory() && file.name ==~ /(\d+)\.(\d+)(\.(\d+))?/)).each {
    def fabricVersion = it.name
    def fabricMajorVersion = fabricVersion.split('\\.')[0] as int

    if (fabricMajorVersion >= 26) {
        include("fabric-$fabricVersion")
        project(":fabric-$fabricVersion").with {
            projectDir = file("fabric/$fabricVersion")
            buildFileName = 'build.gradle'
        }
        return
    }

    include("fabric:$fabricVersion")
    project(":fabric:$fabricVersion").with {
        projectDir = file("fabric/$fabricVersion")
        buildFileName = '../build.gradle'
    }
}